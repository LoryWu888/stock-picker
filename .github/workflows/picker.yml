name: Stock Picker

on:
  schedule:
    # 每天北京时间 15:10 运行 (周一到周五)
    - cron: '10 7 * * 1-5'
  workflow_dispatch: # 允许手动点击运行测试

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-picker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas numpy requests jinja2

      - name: Run stock picker (with retry)
        run: |
          retry_command() {
              n=1
              max=3
              until [ "$n" -ge $max ]
              do
                 echo "Running python3 stock_picker.py (attempt $n of $max)..."
                 python3 stock_picker.py && break
                 n=$((n+1))
                 echo "Script failed. Retrying in 30 seconds..."
                 sleep 30
              done
              if [ $n -ge $max ]; then
                 echo "Command failed after $max attempts."
                 exit 1
              fi
          }
          retry_command

      - name: Move report to root
        run: |
          if [ -f _site/index.html ]; then
            mv _site/index.html index.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: run-picker
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
